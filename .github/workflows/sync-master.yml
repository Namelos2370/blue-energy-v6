# Vercel publie la branche `master` en production.
# Ce workflow recopie automatiquement `main` sur `master` à chaque fusion,
# pour ne plus avoir à publier à la main.
name: Publier main sur master

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fusionner main dans master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout master
          git merge origin/main -X theirs --no-edit -m "Sync master avec main"
          git push origin master
